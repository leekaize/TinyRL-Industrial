upload_port = /dev/ttyACM0
; use +<vibration_streamq_s3/**> for the other folder
build_src_filter = +<vibration_streamq/**>
lib_deps =
    knolleary/PubSubClient@^2.8
build_flags =
    ${env.build_flags}
    -DBOARD_HAS_PSRAM
    -DAG_ESP32_DSP
    -DESP32S3
    -DCONFIG_SPIRAM_USE_MALLOC=1
    -DARDUINO_USB_MODE=1          ; 1 = USB-Serial/JTAG (the ttyACM0 port)
    -DARDUINO_USB_CDC_ON_BOOT=1   ; Serial -> that USB port
    -D SOC_WIFI_SUPPORTED=1
board_build.arduino.memory_type = dio_opi
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
