; =====================================================================
; platformio.ini -- TinyRL modular sensor nodes
;
; LAYOUT
;   nodes/core/          GENERAL core: compiles for EVERY node
;   nodes/sensors/<x>/   ENVIRONMENT packages (one per sensor type)
;   nodes/<x>_node/      node profile: identity + wiring of the two
;
; PREREQUISITE: TinyRL lives next to this file:
;   git clone https://github.com/mohmdelsayed/TinyRL TinyRL
;
; TO ADD A NEW SENSOR NODE (e.g. vibration MPU-6050):
;   1. nodes/sensors/vibration_mpu/  implement ISensorNode
;   2. nodes/vib_node/main.cpp       identity + app.begin()
;   3. copy an [env:...] below, change build_src_filter:
;        +<core/**> +<sensors/vibration_mpu/**> +<vib_node/**>
;      core/** is touched by NOBODY -> every node gets fixes for free.
; =====================================================================
[platformio]
boards_dir = boards     ; only needed when using less common board
src_dir = nodes

; ================================================
; Shared settings for all envs
; ================================================
[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
build_type = release
monitor_speed = 115200
lib_ldf_mode = chain
build_flags =
    -std=c++17
    -O3                         ; optimize hard
    -ffast-math                 ; allow reassociation -> auto-vectorization
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_LOOP_STACK_SIZE=16384     ; 16 KB stack for loopTask
    -ITinyRL/src
    -ITinyRL/examples/stream_x/src
    -DAG_EMBEDDED               ; embedded mode (minimal logging, log.h)
    -Inodes/core

; ---------------------------------------------------------------------
; VFD node: LSIS LSLV-G100 over Modbus-RTU
; ---------------------------------------------------------------------
[env:vfd_g100_node]
board = esp32-s3-devkitc-1
upload_port = /dev/ttyACM0
build_src_filter = +<core/**> +<sensors/vfd_g100/**> +<vfd_g100_node/**>
lib_deps = knolleary/PubSubClient@^2.8
build_flags =
    ${env.build_flags}
    -DBOARD_HAS_PSRAM               ; PSRAM present on the module
    -mfix-esp32-psram-cache-issue   ; HW errata workaround (cache coherency)
    -DAG_ESP32_DSP                  ; fused optimizer kernels (optimizer.h)
    -DESP32S3                       ; -> AG_PLATFORM_ESP32 in simd.h
    -DCONFIG_SPIRAM_USE_MALLOC=1    ; malloc() may return PSRAM memory
    -DARDUINO_USB_MODE=1            ; 1 = USB-Serial/JTAG (the ttyACM0 port)
    -DARDUINO_USB_CDC_ON_BOOT=1     ; Serial -> that USB port
    -DSOC_WIFI_SUPPORTED=1
    -Inodes/sensors/vfd_g100
board_build.arduino.memory_type = dio_opi   ; flash DIO + PSRAM OPI (octal)
board_build.f_cpu = 240000000L              ; 240 MHz dual-core
board_build.f_flash = 80000000L             ; 80 MHz flash clock
board_build.flash_mode = qio

