[platformio]
boards_dir = boards
default_envs = vibration_streamq

; ================================================
; ESP32 classic DevKit — current testing
; ================================================
[env:vibration_streamq]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32dev
framework = arduino
build_type = release
monitor_speed = 115200
upload_port = /dev/ttyACM0
build_flags =
    -O3
    -ffast-math
    -std=c++17
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_LOOP_STACK_SIZE=16384
    -ITinyRL/src
    -ITinyRL
    -ITinyRL/examples/stream_x/src
    -DAG_EMBEDDED
lib_deps = SPI
lib_ldf_mode = off
build_src_filter = +<vibration_streamq.cpp>
; I2C wiring instead of SPI? add  -DUSE_SPI=0  to build_flags

; ================================================
; ESP32-S3 (Freenove WROOM) — ready for later
; ================================================
[env:vibration_streamq_s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = freenove_esp32_s3_wroom
framework = arduino
build_type = release
monitor_speed = 115200
upload_port = /dev/ttyACM0
build_flags =
    -O3
    -ffast-math
    -DBOARD_HAS_PSRAM
    -std=c++17
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_LOOP_STACK_SIZE=16384
    -DARDUINO_USB_CDC_ON_BOOT=1
    -ITinyRL/src
    -ITinyRL
    -ITinyRL/examples/stream_x/src
    -DAG_EMBEDDED
    -DAG_ESP32_DSP
    -DESP32S3
    -DCONFIG_SPIRAM_USE_MALLOC=1
lib_deps = SPI
lib_ldf_mode = off
build_src_filter = +<vibration_streamq.cpp>
board_build.arduino.memory_type = dio_opi
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
