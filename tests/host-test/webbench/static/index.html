<!doctype html>
<html><head><meta charset="utf-8"><title>Interactive monitor bench</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="app.js" defer></script>
</head><body>
<div id="errbar" class="hidden"></div>
<h1>Interactive monitor bench - <span id="hdr"></span></h1>
<div class="controls">
 <button id="b_run5">+5 s</button>
 <button id="b_run60">+60 s</button>
 <button id="b_export" class="grey">export run</button>
 <span id="status"></span>
</div>
<div class="machine">
 <div>
  <b>MOTOR</b><br>
  <span id="m_state" class="m-normal">op_stopped</span>
 </div>
 <div class="inject">
  <span>run:</span>
  <button class="ok" onclick="inject('START')">start motor</button>
  <button onclick="inject('STOP')">stop motor</button>
  <span>setpoint:</span>
  <button onclick="inject('SPEED1')">speed 1 (5 Hz)</button>
  <button onclick="inject('SPEED2')">speed 2 (20 Hz)</button>
  <span>inject fault:</span>
  <button onclick="inject('IMBALANCE')">imbalance</button>
  <button onclick="inject('LOOSE_MOUNT')">loose mounting</button>
  <button onclick="inject('PHASE_LOSS')">phase loss</button>
  <button class="ok" onclick="inject('NORMAL')">clear fault</button>
 </div>
</div>
<div id="ask" class="hidden"></div>
<div class="cards" id="cards"></div>
<div id="charts"></div>
<h2>events</h2><div id="events"></div>
</body></html>
